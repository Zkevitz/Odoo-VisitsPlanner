services:
  db :
    image : postgres:16

    environment:
      POSTGRES_DB : myOdooDB # DB NAME
      POSTGRES_USER : app # USERNAME OF THE APPLICATION FOR DB
      POSTGRES_PASSWORD : ${DB_PASSWORD} # PWD IN LOCAL ENV

    volumes:
      - pgdata:/var/lib/postgresql/myOdooDB-data # VOLUMES PATH FOR DB
      - ./db/init:/docker-entrypoint-initdb.d # SCHEMAS DB/SEED/INIT

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d myOdooDB"]
      # START CMD ENV TO EXECUTE HEALTHCHECK UTILITY OF POSTGRESQL TO CHECK AVAILABILITY
      # FOR THE APPLICATION TO START (on build app must wait for db to start)
      # ( -U use app user / -d target db_name )
      interval: 5s
      retries: 5

  app :
    build : Docker/. # dockerfile in repertory
    environment:
      DATABASE_URL : postgresql://app:${DB_PASSWORD}@db:5432/myOdooDB
      #CONNEXION URL OF THE DB (USE PORT : 5432)
    depends_on:
      db :
        condition: service_healthy
    command: uv run main.py # COMMAND
    stdin_open: true # OPEN STDIN OF APP CONTAINER MAYBE REMOVE IT LATER
    tty: true # ASSIGN TERMINAL TO CONTAINER
